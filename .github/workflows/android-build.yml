name: Build VORTEX MENU

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: unzip -o VORTEX-MENU-APP-BASE.zip -d .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set Java and Kotlin targets to 17
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          if 'jvmTarget = "17"' not in s:
              s = s.replace("android {", """android {
                  compileOptions {
                      sourceCompatibility = JavaVersion.VERSION_17
                      targetCompatibility = JavaVersion.VERSION_17
                  }
                  kotlinOptions {
                      jvmTarget = "17"
                  }
              """, 1)
              p.write_text(s)
          PY

      - name: Fix WRAP_CONTENT reference
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/src/main/java/com/vortex/menu/OverlayService.kt")
          s = p.read_text()
          s = re.sub(
              r"(?<![\w.])WRAP_CONTENT\b",
              "android.view.ViewGroup.LayoutParams.WRAP_CONTENT",
              s
          )
          p.write_text(s)
          PY

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: VORTEX-MENU
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
